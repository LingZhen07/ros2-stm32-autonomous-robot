planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: false
      use_final_approach_orientation: false

# PlannerServer constructs this lifecycle follower at
# /global_costmap/global_costmap and owns its lifecycle transitions.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.140, 0.080], [0.140, -0.080], [-0.070, -0.080], [-0.070, 0.080]]"
      footprint_padding: 0.01
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      track_unknown_space: true
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # Required because the scan-source default is 0.0 m while the
          # verified laser plane is at z=0.165 m in base_link.
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          # Frozen RPLIDAR A1 / Cartographer operating range.
          obstacle_min_range: 0.15
          obstacle_max_range: 12.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Initial Navigation v1 bring-up values; not final tuned values.
        inflation_radius: 0.25
        cost_scaling_factor: 5.0

# Humble 1.1.20's standalone executable is hard-coded to the lifecycle-node
# FQN /costmap/costmap. This is the local rolling costmap; it does not consume
# nav_msgs/Odometry and is intentionally independent of ControllerServer.
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[0.140, 0.080], [0.140, -0.080], [-0.070, -0.080], [-0.070, 0.080]]"
      footprint_padding: 0.01
      resolution: 0.05
      width: 5
      height: 5
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      track_unknown_space: false
      rolling_window: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # Required because the scan-source default is 0.0 m while the
          # verified laser plane is at z=0.165 m in base_link.
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          # Frozen RPLIDAR A1 / Cartographer operating range.
          obstacle_min_range: 0.15
          obstacle_max_range: 12.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Initial Navigation v1 bring-up values; not final tuned values.
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
